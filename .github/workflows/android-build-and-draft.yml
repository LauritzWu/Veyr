name: Build signed Android APK and prepare draft
on:
  push:
    branches: ['candidate/1.0.13-beta.2']
  workflow_dispatch:
    inputs:
      version:
        description: Base version, for example 1.0.4
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        options: [beta, stable]
      beta_iteration:
        description: Beta iteration, blank for stable
        type: string
      build_code:
        description: Android build code, a multiple of 5 greater than previous releases
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-draft
env:
  BASE_VERSION: ${{ inputs.version || '1.0.13' }}
  CHANNEL: ${{ inputs.channel || 'beta' }}
  BETA_ITERATION: ${{ github.event_name == 'push' && '2' || inputs.beta_iteration }}
  REQUESTED_BUILD_CODE: ${{ inputs.build_code || '26540' }}
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Golang Status
        run: find buildScript libcore/*.sh -type f -print0 | sort -z | xargs -0 cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-ci
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.0.8775105
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      build_code: ${{ steps.verify.outputs.build_code }}
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Golang Status
        run: find buildScript libcore/*.sh -type f -print0 | sort -z | xargs -0 cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-ci
      - name: HevTun Status
        run: |
          git submodule status hev-socks5-tunnel > hev_status
          cat buildScript/compile-hevtun.sh | sha1sum >> hev_status
      - name: HevTun Cache
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs
          key: hevtun-${{ hashFiles('.github/workflows/*', 'hev_status') }}-ci
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}-ci
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.1 ndk;25.0.8775105
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GH_TOKEN: ${{ github.token }}
          JC_PREVIEW_KEYSTORE: ${{ secrets.JC_PREVIEW_KEYSTORE }}
          JC_PREVIEW_KEYSTORE_PASS: ${{ secrets.JC_PREVIEW_KEYSTORE_PASS }}
          JC_PREVIEW_KEY_ALIAS: ${{ secrets.JC_PREVIEW_KEY_ALIAS }}
          JC_PREVIEW_KEY_PASS: ${{ secrets.JC_PREVIEW_KEY_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          unset GH_TOKEN
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REQUESTED_BUILD_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          (( REQUESTED_BUILD_CODE > 25810 && REQUESTED_BUILD_CODE <= 2100000000 && REQUESTED_BUILD_CODE % 5 == 0 ))
          if [[ "$CHANNEL" == beta ]]; then
            [[ "$BETA_ITERATION" =~ ^[1-9][0-9]*$ ]]
          else
            [[ "$CHANNEL" == stable && -z "$BETA_ITERATION" ]]
          fi
          version_name="$BASE_VERSION-${CHANNEL^^}"
          if [[ "$CHANNEL" == beta ]]; then
            version_name="$version_name.$BETA_ITERATION"
          fi
          echo "APK_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$version_name/" nb4a.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$((REQUESTED_BUILD_CODE / 5))/" nb4a.properties
          : "${JC_PREVIEW_KEYSTORE:?Missing preview keystore}"
          : "${JC_PREVIEW_KEYSTORE_PASS:?Missing preview keystore password}"
          : "${JC_PREVIEW_KEY_ALIAS:?Missing preview key alias}"
          : "${JC_PREVIEW_KEY_PASS:?Missing preview key password}"
          umask 077
          printf '%s' "$JC_PREVIEW_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT
          unset LOCAL_PROPERTIES
          export KEYSTORE_PASS="$JC_PREVIEW_KEYSTORE_PASS"
          export ALIAS_NAME="$JC_PREVIEW_KEY_ALIAS"
          export ALIAS_PASS="$JC_PREVIEW_KEY_PASS"
          sed -i 's/^PACKAGE_NAME=.*/PACKAGE_NAME=top.lauritz.jc.uipreview.debug/' nb4a.properties
          ./gradlew app:assembleOssRelease
          echo "ROOM_SCHEMA_9=$(base64 -w0 app/schemas/io.nekohasekai.sagernet.database.SagerDatabase/9.json)"
      - name: Verify signed ARM64 upgrade candidate
        id: verify
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/oss/release -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/35.0.1"
          "$tools/aapt" dump badging "${apks[0]}" > apk-badging.txt
          grep -F "package: name='top.lauritz.jc.uipreview.debug'" apk-badging.txt
          grep -Fx "application-label:'Veyr'" apk-badging.txt
          grep -F "versionName='$APK_VERSION_NAME'" apk-badging.txt
          build_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" apk-badging.txt)
          test "$build_code" -eq "$REQUESTED_BUILD_CODE"
          test "$build_code" -gt 25800
          if grep -Fxq 'application-debuggable' apk-badging.txt; then
            echo 'Stable candidate must not be debuggable' >&2
            exit 1
          fi
          "$tools/apksigner" verify --print-certs "${apks[0]}" > apk-signing.txt
          grep -Fiqx "Signer #1 certificate SHA-256 digest: 0b316ceb4bfe0c9f3e6f69e3b1444233587276017ecb9cd1e95ef4642eab8c56" apk-signing.txt
          "$tools/zipalign" -c -P 16 4 "${apks[0]}"
          echo "build_code=$build_code" >> "$GITHUB_OUTPUT"
          cp "${apks[0]}" veyr-candidate-arm64-v8a.apk
      - uses: actions/upload-artifact@v5
        id: upload
        with:
          name: veyr-candidate-arm64-v8a
          path: veyr-candidate-arm64-v8a.apk
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_CODE: ${{ needs.build.outputs.build_code }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.1
      - name: Verify APK and prepare a draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_CODE" =~ ^[1-9][0-9]{0,9}$ && "$BUILD_CODE" -le 2100000000 ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

          release_args=()
          if [[ "$CHANNEL" == stable ]]; then
            [[ -z "$BETA_ITERATION" ]]
            version_name="$BASE_VERSION-STABLE"
            release_tag="v$BASE_VERSION-stable.$BUILD_CODE"
            asset="veyr-$BASE_VERSION-stable-arm64-v8a.apk"
          else
            [[ "$CHANNEL" == beta && "$BETA_ITERATION" =~ ^[1-9][0-9]*$ ]]
            version_name="$BASE_VERSION-BETA.$BETA_ITERATION"
            release_tag="v$BASE_VERSION-beta.$BETA_ITERATION.$BUILD_CODE"
            if [[ "$BETA_ITERATION" == 1 ]]; then
              asset="veyr-$BASE_VERSION-beta-arm64-v8a.apk"
            else
              asset="veyr-$BASE_VERSION-beta.$BETA_ITERATION-arm64-v8a.apk"
            fi
            release_args+=(--prerelease)
          fi

          release_title="Veyr $version_name"
          latest_before=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          max_build=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -s '[.[][] | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+-(stable|preview|beta[.][0-9]+)[.][0-9]+$")) | split(".") | last | tonumber] | max // 0')

          (( BUILD_CODE > max_build ))
          draft_tag="$release_tag"

          metadata=$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID")
          jq -e '.expired == false' <<< "$metadata" > /dev/null
          artifact_digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$metadata")
          source_sha=$(jq -er '.workflow_run.head_sha' <<< "$metadata")
          run_id=$(jq -er '.workflow_run.id' <<< "$metadata")
          test "$run_id" = "$GITHUB_RUN_ID"
          test "$source_sha" = "$GITHUB_SHA"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" --output candidate.zip
          echo "${artifact_digest#sha256:}  candidate.zip" | sha256sum --check
          entries=$(unzip -Z1 candidate.zip)
          [[ "$entries" =~ ^[A-Za-z0-9._-]+-arm64-v8a\.apk$ ]]
          unzip -p candidate.zip "$entries" > "$asset"

          tools="$ANDROID_HOME/build-tools/35.0.1"
          "$tools/aapt" dump badging "$asset" > badging.txt
          grep -E "^package: name='top[.]lauritz[.]jc[.]uipreview[.]debug' versionCode='$BUILD_CODE' versionName='$version_name'" badging.txt
          grep -Fx "native-code: 'arm64-v8a'" badging.txt
          if [[ "$CHANNEL" == stable ]] && grep -Fxq 'application-debuggable' badging.txt; then
            echo 'Stable APK must not be debuggable' >&2
            exit 1
          fi
          "$tools/apksigner" verify --print-certs "$asset" > signing.txt
          grep -Fiqx 'Signer #1 certificate SHA-256 digest: 0b316ceb4bfe0c9f3e6f69e3b1444233587276017ecb9cd1e95ef4642eab8c56' signing.txt
          "$tools/zipalign" -c -P 16 4 "$asset"
          sha256sum "$asset" > SHA256SUMS

          # GitHub resolves the tag-based download links once the draft is published.
          download_base="https://github.com/$GH_REPO/releases/download/$release_tag"
          {
            printf '**[下载 ARM64 APK](%s/%s)** · [SHA-256](%s/SHA256SUMS)\n\n' "$download_base" "$asset" "$download_base"
            printf 'Veyr %s\n\n' "$version_name"
            printf '已有 Veyr 的用户可以直接覆盖安装。\n\n'
            printf '## 更新内容\n\n'
            printf '%s\n' '- 点击节点延迟查看测速方式和时间，可单独重新测速。'
            printf '\n'
            printf '[构建记录](https://github.com/%s/actions/runs/%s)\n' "$GH_REPO" "$run_id"
          } > release-notes.md

          gh release create "$draft_tag" "$asset" SHA256SUMS --target "$source_sha" \
            --draft "${release_args[@]}" --title "$release_title" \
            --notes-file release-notes.md
          gh release download "$draft_tag" --pattern "$asset" --dir verified
          (cd verified && sha256sum --check ../SHA256SUMS)
          test "$(gh release view "$draft_tag" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$latest_before"
